name: Build & Push Docker Image

on:
  push:
    branches:
      - dev
      - uat
      - staging

env:
  ACR_NAME: chatappregsistry
  IMAGE_NAME: chat-app

jobs:
  build-and-push:
    if: github.ref == 'refs/heads/dev'  # सिर्फ dev ब्रांच के लिए build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set Image Tag
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "IMAGE_TAG=dev-${SHORT_SHA}" >> $GITHUB_ENV

      - name: Login to ACR
        run: az acr login --name $ACR_NAME

      - name: Build Docker Image
        run: |
          echo "Building image: $IMAGE_TAG"
          docker build -t $ACR_NAME.azurecr.io/$IMAGE_NAME:$IMAGE_TAG .

      - name: Push Docker Image
        run: |
          echo "Pushing image..."
          docker push $ACR_NAME.azurecr.io/$IMAGE_NAME:$IMAGE_TAG

      - name: Output Image Info
        run: |
          echo "✅ Image pushed successfully:"
          echo "$ACR_NAME.azurecr.io/$IMAGE_NAME:$IMAGE_TAG"

  deploy:
    if: github.ref != 'refs/heads/dev'  # dev के अलावा (uat, staging) के लिए deploy
    runs-on: ubuntu-latest
    needs: build-and-push  # dev build पर निर्भर है

    steps:
      - name: Set ENV
        run: echo "ENV_NAME=${GITHUB_REF##*/}" >> $GITHUB_ENV

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        run: az acr login --name $ACR_NAME

      - name: Deploy (placeholder step)
        run: |
          echo "Deploying to $ENV_NAME environment..."
          # यहाँ तुम Helm या AKS deployment कमांड लगा सकते हो।
          # उदाहरण के लिए:
          # helm upgrade --install your-app ./chart --set image.tag=$IMAGE_TAG --namespace=$ENV_NAME