name: Deploy to Staging

on:
  push:
    branches:
      - staging

env:
  ACR_NAME: chatappregsistry
  IMAGE_NAME: chat-app

jobs:
  deploy-staging:
    runs-on: ubuntu-latest

    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        run: az acr login --name $ACR_NAME

      - name: Get latest dev image tag
        run: |
          LATEST_DEV_TAG=$(az acr repository show-tags --name $ACR_NAME --repository $IMAGE_NAME --query "[?starts_with(@, 'dev-')].[].@" --output tsv | sort | tail -n 1)
          echo "IMAGE_TAG=$LATEST_DEV_TAG" >> $GITHUB_ENV
          echo "Using image tag: $IMAGE_TAG"

      - name: Deploy to Staging
        run: |
          echo "Deploying Staging with image $IMAGE_TAG..."
          # यहाँ स्टेजिंग environment के लिए तुम्हारी कमांड होगी
          # उदाहरण: helm upgrade --install staging-release ./chart --set image.tag=$IMAGE_TAG --namespace=staging