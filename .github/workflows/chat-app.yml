name: Deploy to UAT

on:
  push:
    branches:
      - uat

env:
  ACR_NAME: chatappregsistry
  IMAGE_NAME: chat-app

jobs:
  deploy-uat:
    runs-on: ubuntu-latest

    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        run: az acr login --name $ACR_NAME

      - name: Get latest dev image tag
        run: |
          # Get the latest tag that starts with 'dev-'
          LATEST_DEV_TAG=$(az acr repository show-tags --name $ACR_NAME --repository $IMAGE_NAME --query "[?starts_with(@, 'dev-')].[].@" --output tsv | sort | tail -n 1)
          echo "IMAGE_TAG=$LATEST_DEV_TAG" >> $GITHUB_ENV
          echo "Using image tag: $IMAGE_TAG"

      - name: Deploy to UAT
        run: |
          echo "Deploying UAT with image $IMAGE_TAG..."
          # तुम्हारी असली डिप्लॉयमेंट कमांड यहाँ होगी
          # उदाहरण: helm upgrade --install uat-release ./chart --set image.tag=$IMAGE_TAG --namespace=uat