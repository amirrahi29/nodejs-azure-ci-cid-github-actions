name: Build & Push Docker Image

on:
  push:
    branches:
      - dev
      - uat
      - staging

env:
  ACR_NAME: ChatAppRegsistry 
  IMAGE_NAME: chat-app-imge

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Azure Login
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # 3️⃣ Set environment (branch name)
      - name: Set ENV
        run: echo "ENV_NAME=${GITHUB_REF##*/}" >> $GITHUB_ENV

      # 4️⃣ Login to ACR
      - name: Login to ACR
        run: az acr login --name $ACR_NAME

      # 5️⃣ Build & Tag Docker Image
      - name: Build Docker Image
        run: |
          echo "Building image for $ENV_NAME..."
          docker build \
          -t $ACR_NAME.azurecr.io/$IMAGE_NAME:$ENV_NAME \
          -t $ACR_NAME.azurecr.io/$IMAGE_NAME:latest .

      # 6️⃣ Push Docker Image
      - name: Push Docker Image
        run: |
          echo "Pushing image..."
          docker push $ACR_NAME.azurecr.io/$IMAGE_NAME:$ENV_NAME
          docker push $ACR_NAME.azurecr.io/$IMAGE_NAME:latest

      # 7️⃣ Verify push (optional but useful)
      - name: Verify Image in ACR
        run: |
          az acr repository list --name $ACR_NAME --output table

      # 8️⃣ Output image URL
      - name: Image Info
        run: |
          echo "✅ Image pushed successfully:"
          echo "$ACR_NAME.azurecr.io/$IMAGE_NAME:$ENV_NAME"