# Base defaults — har environment ke liye helm/values-<dev|staging|uat>.yaml iske upar merge hota hai (CI se -f).
replicaCount: 2

image:
  repository: chatappregsistry.azurecr.io/chat-app
  pullPolicy: IfNotPresent
  tag: "dev-latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Ingress ON: ClusterIP (traffic Ingress controller se aata hai). Ingress OFF: LoadBalancer se seedha IP.
service:
  type: LoadBalancer
  port: 80
  targetPort: 3000
  annotations: {}
  # Internal LB chahiye ho to:
  # annotations:
  #   service.beta.kubernetes.io/azure-load-balancer-internal: "true"

# AKS par pehle NGINX Ingress Controller install karo (ek baar cluster par), phir hosts DNS se usi EXTERNAL-IP par point karo.
#  helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
#  helm install ingress-nginx ingress-nginx/ingress-nginx -n ingress-nginx --create-namespace
ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts: []
  tls: []

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: ""

podAnnotations: {}

nodeSelector: {}
tolerations: []
affinity: {}

livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5

env:
  - name: NODE_ENV
    value: production
  - name: PORT
    value: "3000"
