# Staging — branch: staging → namespace: staging → image tag: staging-<sha>
service:
  type: ClusterIP

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: staging.mergeai.in
      paths:
        - path: /
          pathType: Prefix

env:
  - name: NODE_ENV
    value: production
  - name: PORT
    value: "3000"
  - name: DEPLOY_ENV
    value: staging

autoscaling:
  minReplicas: 2
  maxReplicas: 8
