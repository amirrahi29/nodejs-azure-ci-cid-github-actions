# Dev — branch: dev → K8s namespace: dev → image tag: dev-<sha>
# Bina domain: LoadBalancer = EXTERNAL-IP (browser se seedha). Domain + NGINX Ingress ho tab niche Ingress on karo.
service:
  type: LoadBalancer

ingress:
  enabled: false
  className: nginx
  hosts:
    - host: dev.mergeai.in
      paths:
        - path: /
          pathType: Prefix

env: 
  - name: NODE_ENV
    value: production
  - name: PORT
    value: "3000"
  - name: DEPLOY_ENV
    value: dev

autoscaling:
  minReplicas: 1
  maxReplicas: 5
