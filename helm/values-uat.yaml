# UAT — branch: uat → namespace: uat → image tag: uat-<sha>
service:
  type: ClusterIP

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: uat.mergeai.in
      paths:
        - path: /
          pathType: Prefix

env:
  - name: NODE_ENV
    value: production
  - name: PORT
    value: "3000"
  - name: DEPLOY_ENV
    value: uat

autoscaling:
  minReplicas: 2
  maxReplicas: 10
